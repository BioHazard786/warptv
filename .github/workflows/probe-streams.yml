name: Probe streams

# Checks every iptv-org stream once a day and publishes health.json to the stream-health branch.
# The web app and the Stremio addon read it (through jsDelivr) to hide dead streams.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: probe-streams

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Probe
        env:
          PREVIOUS_URL: https://raw.githubusercontent.com/${{ github.repository }}/stream-health/health.json
        run: bun scripts/probe-streams.ts --out "$RUNNER_TEMP/health.json"
      - name: Publish
        working-directory: ${{ runner.temp }}
        run: |
          mkdir out && mv health.json out/ && cd out
          git init -q -b stream-health
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add health.json
          git commit -qm "Stream health $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" stream-health
      - name: Refresh the CDN copy
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@stream-health/health.json" || true
